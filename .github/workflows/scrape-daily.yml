name: Scrape deck data (daily)

on:
  schedule:
    # 毎日 0:00 UTC (日本時間 9:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write  # push 用（read を含む）

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: monca/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: monca

      - name: Scrape deck data
        run: npm run scrape
        working-directory: monca

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monca/public/deck-data-*.json
          git diff --staged --quiet || (git commit -m "chore: update deck data (scheduled scrape)" && git push)
